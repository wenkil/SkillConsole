name: skillconsole

services:
  postgres:
    image: "${DOCKER_REGISTRY:-}postgres:18-alpine"
    profiles:
      - development
      - production
    environment:
      POSTGRES_DB: skillconsole
      POSTGRES_USER: skillconsole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillconsole}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U skillconsole -d skillconsole
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql

  migrate:
    profiles:
      - development
      - production
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migration
      args:
        BUILDKIT_SYNTAX: "${DOCKER_REGISTRY:-}docker/dockerfile:1.7"
        NODE_IMAGE: "${DOCKER_REGISTRY:-}node:22-bookworm-slim"
    environment:
      DATABASE_URL: postgres://skillconsole:${POSTGRES_PASSWORD:-skillconsole}@postgres:5432/skillconsole
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    profiles:
      - development
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: development
      args:
        BUILDKIT_SYNTAX: "${DOCKER_REGISTRY:-}docker/dockerfile:1.7"
        NODE_IMAGE: "${DOCKER_REGISTRY:-}node:22-bookworm-slim"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://skillconsole:${POSTGRES_PASSWORD:-skillconsole}@postgres:5432/skillconsole
      OPENAPI_ENABLED: "true"
      SKILLCONSOLE_DATA_ROOT: /workspace/var
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./apps/server/src:/workspace/apps/server/src
      - skillconsole_data:/workspace/var

  web:
    profiles:
      - development
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
      args:
        BUILDKIT_SYNTAX: "${DOCKER_REGISTRY:-}docker/dockerfile:1.7"
        NODE_IMAGE: "${DOCKER_REGISTRY:-}node:22-bookworm-slim"
        NGINX_IMAGE: "${DOCKER_REGISTRY:-}nginx:1.29-alpine"
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:5173"
    restart: unless-stopped
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/index.html:/workspace/apps/web/index.html
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts
      - ./apps/web/tsconfig.json:/workspace/apps/web/tsconfig.json

  app:
    profiles:
      - production
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        BUILDKIT_SYNTAX: "${DOCKER_REGISTRY:-}docker/dockerfile:1.7"
        NODE_IMAGE: "${DOCKER_REGISTRY:-}node:22-bookworm-slim"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://skillconsole:${POSTGRES_PASSWORD:-skillconsole}@postgres:5432/skillconsole
      OPENAPI_ENABLED: "false"
      STATIC_ROOT: /workspace/apps/web/dist
      SKILLCONSOLE_DATA_ROOT: /workspace/var
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/ready').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - skillconsole_data:/workspace/var

volumes:
  postgres_data:
  skillconsole_data:
